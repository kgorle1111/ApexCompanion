name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.14.0 check .
      - run: uvx ruff@0.14.0 format --check .

  test:
    # MLX only ships Apple Silicon wheels; tests never load the model weights.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      # An app, not a library: install its dependencies, never build it as a package.
      - run: uv pip install -r pyproject.toml --extra dev
      - name: pytest
        run: |
          set +e
          uv run --no-sync pytest -q
          code=$?
          [ $code -eq 5 ] && echo "no tests collected yet" && exit 0
          exit $code
